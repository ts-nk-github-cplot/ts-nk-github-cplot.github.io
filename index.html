<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      #app {
        width: 100vw;
        overflow: auto;
      }
      .tile {
        height: 600px;
        width: 600px;
      }
      .full-liveboard {
        width: 100%;
      }
      .nav {
        padding: 8px;
      }
      .pv-layout {
        display: flex;
        align-items: flex-start;
      }
      .pv-layout .full-liveboard {
        flex: 1;
        min-width: 0;
      }
      .pv-sidebar {
        width: 320px;
        flex-shrink: 0;
        padding: 8px;
        box-sizing: border-box;
        font-size: 13px;
        position: sticky;
        top: 0;
        max-height: 100vh;
        overflow-y: auto;
      }
      .pv-sidebar section {
        margin-bottom: 12px;
      }
      .pv-sidebar h4 {
        margin: 4px 0;
      }
      .pv-sidebar button,
      .pv-sidebar label {
        display: block;
        width: 100%;
        margin: 3px 0;
        text-align: left;
      }
      .pv-login-hint {
        background: #fff4e5;
        border: 1px solid #f0c987;
        padding: 8px;
        margin: 0 8px 8px;
        font-size: 13px;
      }
      .pv-login-hint[hidden] {
        display: none;
      }
      .pv-code-panel {
        width: 380px;
        flex-shrink: 0;
        padding: 8px;
        box-sizing: border-box;
        font-size: 13px;
        position: sticky;
        top: 0;
        max-height: 100vh;
        overflow: auto;
      }
      .pv-code {
        font-size: 12px;
        background: #f6f8fa;
        padding: 8px;
        margin: 4px 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .pv-fetch-status {
        font-size: 12px;
        color: #555;
        margin: 4px 0;
      }
      .pv-views {
        list-style: none;
        padding: 0;
        margin: 4px 0;
      }
      .pv-views li {
        cursor: pointer;
        padding: 3px 4px;
        border-bottom: 1px solid #eee;
      }
      .pv-views li:hover {
        background: #f3f3f3;
      }
      .pv-repro-note {
        font-size: 12px;
        background: #fffbe6;
        border: 1px solid #f0e0a0;
        padding: 6px;
        margin: 4px 0;
      }
      .pv-scenarios {
        list-style: none;
        padding: 0;
        margin: 4px 0;
      }
      .pv-scenarios li {
        padding: 3px 4px;
        border-bottom: 1px solid #eee;
      }
      .pv-scenarios li.fail {
        background: #fff1f0;
      }
      .pv-scenarios li.pass {
        background: #f0fff4;
      }
      .pv-scenario-detail {
        font-size: 11px;
        color: #555;
        word-break: break-all;
      }
      .pv-log {
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 300px;
        overflow-y: auto;
        background: #fafafa;
        padding: 4px;
      }
    </style>
    <script type="module" crossorigin src="/assets/main-CMcQxiyD.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
