<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PV scenarios · TSE SWAT</title>
    <style>
      .pv-layout {
        display: flex;
        align-items: flex-start;
      }
      .pv-layout .full-liveboard {
        flex: 1;
        min-width: 0;
      }
      .pv-sidebar,
      .pv-code-panel {
        flex-shrink: 0;
        position: sticky;
        top: var(--appbar-h);
        max-height: calc(100vh - var(--appbar-h));
        overflow-y: auto;
        padding: 16px;
      }
      .pv-sidebar {
        width: 320px;
        border-right: 1px solid var(--line);
      }
      .pv-code-panel {
        width: 380px;
        border-left: 1px solid var(--line);
      }
      .pv-sidebar section,
      .pv-code-panel section {
        margin-bottom: 24px;
      }
      .pv-sidebar button,
      .pv-sidebar label {
        display: flex;
        width: 100%;
        margin: 4px 0;
      }
      .pv-sidebar button {
        justify-content: flex-start;
        border-radius: 8px;
      }
      .pv-sidebar label {
        align-items: center;
        min-height: 32px;
      }
      .pv-sidebar select {
        margin-left: 8px;
        flex: 1;
      }
      .pv-code {
        margin: 8px 0;
      }
      .pv-fetch-status {
        margin: 8px 0;
        font-size: 12px;
        color: var(--ink-2);
      }
      .pv-views,
      .pv-scenarios {
        list-style: none;
        padding: 0;
        margin: 8px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .pv-views li,
      .pv-scenarios li {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line-soft);
      }
      .pv-views li:last-child,
      .pv-scenarios li:last-child {
        border-bottom: 0;
      }
      .pv-views li {
        cursor: pointer;
      }
      .pv-views li:hover {
        background: var(--surface-2);
      }
      .pv-repro-note {
        margin: 8px 0;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--yellow-50);
        color: var(--yellow-700);
        font-size: 12px;
        line-height: 16px;
      }
      .pv-scenarios li.fail {
        background: var(--red-50);
      }
      .pv-scenarios li.pass {
        background: var(--green-50);
      }
      .pv-scenario-detail {
        font-size: 11px;
        color: var(--ink-2);
        word-break: break-all;
      }
      .pv-log {
        max-height: 300px;
        overflow-y: auto;
        font-size: 11px;
      }
    </style>
    <script type="module" crossorigin src="/assets/pv-scenarios-C6LjjhQl.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/page-chrome-DtQrRXBx.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
