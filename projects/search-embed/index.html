<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search embed · TSE SWAT</title>
    <style>
      .page-bar {
        color: var(--ink-2);
      }
      .page-bar label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .page-bar input[type="text"] {
        width: 300px;
      }
      #cluster-toggle {
        display: inline-flex;
      }
      #cluster-toggle button {
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        font-size: 12px;
        cursor: pointer;
      }
      #cluster-toggle button:first-child {
        border-radius: 8px 0 0 8px;
      }
      #cluster-toggle button:last-child {
        border-radius: 0 8px 8px 0;
        border-left: 0;
      }
      #cluster-toggle button.active {
        background: var(--blue-50);
        border-color: var(--blue-600);
        color: var(--blue-700);
        font-weight: 500;
      }
      #actions {
        flex-direction: column;
        align-items: flex-start;
        color: var(--ink-2);
      }
      #actions label {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .location {
        margin-left: 8px;
        font-size: 12px;
        color: var(--ink-3);
      }
      #presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #presets button {
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font-size: 12px;
        cursor: pointer;
      }
      #expectation {
        color: var(--ink-3);
        font-size: 12px;
      }
      #layout {
        display: flex;
        align-items: flex-start;
      }
      #main-col {
        flex: 1;
        min-width: 0;
      }
      #pr-changes {
        width: 340px;
        flex-shrink: 0;
        padding: 12px 16px;
        border-left: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-2);
        font-size: 12px;
        max-height: calc(100vh - 56px);
        overflow-y: auto;
        position: sticky;
        top: 56px;
      }
      #pr-changes h2 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--ink);
      }
      #pr-changes h3 {
        margin: 12px 0 4px;
        font-size: 12px;
        color: var(--ink);
      }
      #pr-changes ul {
        margin: 0;
        padding-left: 16px;
      }
      [hidden] {
        display: none !important;
      }
      #config {
        margin: 12px 16px;
      }
    </style>
    <script type="module" crossorigin src="/assets/search-embed-C8BNKpL7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/page-chrome-fQRNd09V.css">
  </head>
  <body>
    <div id="layout">
    <div id="main-col">
    <div class="page-bar" id="cluster-bar">Cluster: <span id="cluster-toggle"></span></div>
    <div class="page-bar" id="controls"></div>
    <div class="page-bar" id="actions"></div>
    <div class="page-bar" id="presets"></div>
    <div class="page-bar" id="expectation"></div>
    <pre id="config"></pre>
    <div id="app"></div>
    </div>
    <aside id="pr-changes"></aside>
    </div>
  </body>
</html>
