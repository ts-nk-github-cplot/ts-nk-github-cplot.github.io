<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New actions · TSE SWAT</title>
    <style>
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line-soft);
        color: var(--ink-2);
      }
      .bar label {
        display: inline-flex;
        align-items: center;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .key {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .bar button.action {
        gap: 4px;
        height: 28px;
        padding: 0 10px;
        border-radius: 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 400;
      }
      .bar button.action .dot:first-of-type {
        margin-left: 6px;
      }
      .bar button.action.active {
        background: var(--blue-50);
        border-color: var(--blue-600);
        color: var(--blue-700);
        font-weight: 500;
      }
      .bar button.action:disabled {
        color: var(--ink-3);
        background: var(--surface-2);
        border-style: dashed;
      }
      #panel {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        margin: 16px;
      }
      #locations {
        flex: 1;
        margin: 0;
        padding: 12px 16px 12px 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 12px;
        line-height: 20px;
        color: var(--ink-2);
      }
      .scaligent-reason {
        margin-top: 2px;
        color: var(--yellow-700);
      }
      .bar.not-fixed {
        align-items: flex-start;
      }
      .bar.not-fixed ul {
        flex-basis: 100%;
        margin: 0;
        padding-left: 20px;
        font-size: 12px;
        line-height: 20px;
      }
      .bar.not-fixed strong {
        font-weight: 500;
        color: var(--ink);
      }
      #config {
        flex: 1;
      }
    </style>
    <script type="module" crossorigin src="/assets/new-actions-CGiy0j-I.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/page-chrome-DtQrRXBx.css">
  </head>
  <body>
    <div id="controls"></div>
    <div id="panel">
      <ul id="locations"></ul>
      <pre id="config"></pre>
    </div>
    <div id="app"></div>
  </body>
</html>
